<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RailSentry</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b58900' stroke-width='2' stroke-linecap='round'><rect x='4' y='3' width='16' height='14' rx='3'/><path d='M4 11h16M8 21l2-4M16 21l-2-4'/><circle cx='8.5' cy='14' r='.8'/><circle cx='15.5' cy='14' r='.8'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before the first paint so the page never flashes.
      (function () {
        var choice = "dark";
        try { choice = localStorage.getItem("railway-theme") || "dark"; } catch (e) {}
        var dark = choice === "dark" ||
          (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
